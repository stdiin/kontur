[package]
name = "kontur"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
rkyv = "0.8.18"
zstd = "0.14.0"
image = { version = "0.25", features = ["jpeg", "png"] }
egui-file-dialog = "0.15.0"
egui_ltreeview = "0.9.0"
eframe = { version = "0.36.2", default-features = false, features = [
    "wayland",
    "default_fonts",
    "wgpu",
] }
